<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi + llama.cpp — reasoning and slot pinning</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #121b23; }
  body { display: grid; place-items: center; min-height: 100vh; }
  canvas { display: block; width: min(100vw, 960px); height: auto; }
</style>
</head>
<body>
<canvas width="640" height="400" aria-label="Animated comparison of native reasoning discovery and session slot pinning. Pi alone versus Pi with the extension."></canvas>
<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const C = { bg: '#121b23', panel: '#202a34', white: '#f2f1ed', muted: '#c1c9d0', blue: '#92c5e9', amber: '#f1be58', line: '#7c8d99' };
const DURATION = 28;
const clamp = x => Math.max(0, Math.min(1, x));
function box(x, y, w, h, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 6);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
function label(text, x, y, size = 16, color = C.white, align = 'left') {
  ctx.font = `bold ${size}px sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(text, x, y);
}
function line(x1, y1, x2, y2, color, width = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.stroke();
}
function wedge(x, y, width, height, reveal = 1) {
  const gap = 4, segment = (width - gap * 2) / 3;
  for (let i = 0; i < 3; i++) {
    const left = x + i * (segment + gap), right = left + segment;
    const topLeft = y + height * (0.8 - 0.8 * (left - x) / width);
    const topRight = y + height * (0.8 - 0.8 * (right - x) / width);
    ctx.beginPath(); ctx.moveTo(left, y + height); ctx.lineTo(left, topLeft);
    ctx.lineTo(right, topRight); ctx.lineTo(right, y + height); ctx.closePath();
    ctx.strokeStyle = C.blue; ctx.lineWidth = 2;
    if (reveal >= (i + 1) / 3) { ctx.fillStyle = C.blue; ctx.fill(); } else ctx.stroke();
  }
}
function pulse(x1, y1, x2, y2, progress, color) {
  if (progress <= 0 || progress >= 1) return;
  ctx.beginPath(); ctx.arc(x1 + (x2 - x1) * progress, y1 + (y2 - y1) * progress, 5, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}
function reasoning(enhanced, t) {
  label(enhanced ? 'Native effort revealed' : 'Native effort unseen', 16, 54, 22);
  box(16, 76, 135, 82, C.panel, enhanced ? C.blue : C.line);
  box(207, 76, 97, 82, C.panel, C.line);
  label('>_ Pi', 27, 98, 16);
  wedge(220, 91, 70, 40);
  label('model', 255, 148, 13, C.muted, 'center');
  line(153, 117, 205, 117, enhanced ? C.blue : C.line);
  if (enhanced) {
    box(140, 76, 12, 82, C.blue);
    pulse(204, 117, 153, 117, clamp(t / 0.8), C.blue);
    wedge(29, 110, 105, 37, clamp((t - 0.6) / 1.0));
    label('low · medium · xhigh', 160, 182, 17, C.blue, 'center');
  } else {
    label('off · medium', 84, 133, 16, C.white, 'center');
    label('?', 178, 106, 19, C.muted, 'center');
    label('Model levels not discovered', 160, 182, 15, C.muted, 'center');
  }
}
function slots(pinned, t) {
  label(pinned ? 'Each session keeps its slot' : 'Sessions can displace cache', 16, 54, 20);
  const turn = Math.min(2, Math.floor(t / 1.6));
  const activeB = turn === 1;
  const activeColor = activeB ? C.amber : C.blue;
  const activeY = activeB ? 133 : 95;
  box(198, 68, 106, 95, C.panel, C.line);
  label('model', 251, 83, 12, C.muted, 'center');
  const firstColor = pinned || !activeB ? C.blue : C.amber;
  box(209, 88, 84, 22, firstColor);
  box(209, 122, 84, 22, pinned && t > 1.6 ? C.amber : C.bg, pinned && t > 1.6 ? null : C.line);
  label('slot 0', 251, 104, 13, C.bg, 'center');
  label('slot 1', 251, 138, 13, pinned && t > 1.6 ? C.bg : C.muted, 'center');
  if (pinned) {
    line(104, 95, 209, 99, C.blue); line(104, 133, 209, 133, C.amber);
  } else {
    line(104, activeY, 209, 99, activeColor);
  }
  box(16, 83, 88, 25, C.blue); box(16, 121, 88, 25, C.amber);
  label('>_ Agent A', 24, 101, 13, C.bg); label('>_ Agent B', 24, 139, 13, C.bg);
  pulse(106, activeY, 207, pinned && activeB ? 133 : 99, (t % 1.6) / 0.8, activeColor);
  if (!pinned && turn > 0) {
    // One possible displacement, not a claim that every unpinned request misses cache.
    const flash = clamp(1 - (t % 1.6) / 0.65);
    ctx.globalAlpha = flash;
    line(214, 91, 286, 107, C.bg, 3); line(214, 107, 286, 91, C.bg, 3);
    ctx.globalAlpha = 1;
  }
  label(pinned ? 'Supports cache reuse' : 'Cache invalidation → reprocess', 160, 182, pinned ? 17 : 16, pinned ? C.blue : C.amber, 'center');
}
// One deterministic timeline drives playback, inspection, and frame export.
window.renderAt = function(seconds) {
  const time = ((seconds % DURATION) + DURATION) % DURATION;
  const scene = Math.floor(time / 7), local = time % 7;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, 320, 200);
  label(scene % 2 ? 'Pi + extension' : scene < 2 ? 'Pi 1.5.2 · Qwen example' : 'Pi 1.5.2 alone', 16, 23, scene === 0 ? 12 : 15, scene % 2 ? C.blue : C.muted);
  label(scene < 2 ? 'REASONING' : 'SLOTS', 304, 23, 11, C.muted, 'right');
  if (scene < 2) reasoning(scene === 1, local); else slots(scene === 3, local);
  for (let i = 0; i < 4; i++) box(134 + i * 14, 193, 9, 3, i === scene ? C.blue : C.line);
};
const params = new URLSearchParams(location.search);
const still = params.has('t') || params.has('verify') || matchMedia('(prefers-reduced-motion: reduce)').matches;
let elapsed = Number(params.get('t') || 0), paused = still, last;
window.renderAt(elapsed);
function tick(now) {
  if (last !== undefined && !paused) elapsed += (now - last) / 1000;
  last = now; window.renderAt(elapsed); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
canvas.addEventListener('click', () => { paused = !paused; });
window.addEventListener('keydown', event => {
  if (event.code === 'Space') { event.preventDefault(); paused = !paused; }
  if (event.code === 'ArrowRight') { elapsed = (Math.floor(elapsed / 7) + 1) * 7; paused = true; }
  if (event.code === 'ArrowLeft') { elapsed = Math.max(0, (Math.floor(elapsed / 7) - 1) * 7); paused = true; }
});
</script>
</body>
</html>
