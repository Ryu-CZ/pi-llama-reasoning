<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <rect width="1600" height="720" fill="#111b23"/>
  <g fill="#f3f1eb" font-family="DejaVu Sans, sans-serif">
    <text x="72" y="100" font-family="DejaVu Serif, serif" font-size="56" font-style="italic" font-weight="bold">pi-llama-reasoning</text>
    <text x="72" y="181" font-size="49" font-weight="bold">Native reasoning. Stable session slots.</text>

    <rect x="72" y="245" width="700" height="403" rx="16" fill="#1c2a35"/>
    <text x="108" y="319" font-size="36" font-weight="bold">More than on / off</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="29" text-anchor="middle">
      <rect x="108" y="425" width="126" height="80" rx="9" fill="#263946" stroke="#607583"/>
      <text x="171" y="476">off</text>
      <rect x="248" y="425" width="126" height="80" rx="9" fill="#263946" stroke="#8ec7ed"/>
      <text x="311" y="476" fill="#8ec7ed">low</text>
      <rect x="388" y="425" width="178" height="80" rx="9" fill="#8ec7ed"/>
      <text x="477" y="476" fill="#111b23" font-weight="bold">medium</text>
      <rect x="580" y="425" width="156" height="80" rx="9" fill="#263946" stroke="#8ec7ed"/>
      <text x="658" y="476" fill="#8ec7ed">xhigh</text>
    </g>

    <rect x="800" y="245" width="728" height="403" rx="16" fill="#1c2a35"/>
    <text x="836" y="319" font-size="36" font-weight="bold">Each session keeps its slot</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="30">
      <text x="850" y="411">Session A</text>
      <text x="850" y="486">Session B</text>
      <text x="850" y="561">Session C</text>
      <path d="M1045 400 H1210 M1198 392 L1210 400 L1198 408 M1045 475 H1210 M1198 467 L1210 475 L1198 483 M1045 550 H1210 M1198 542 L1210 550 L1198 558" stroke="#9ddbc0" stroke-width="3" fill="none"/>
      <g fill="#263e39" stroke="#9ddbc0">
        <rect x="1236" y="371" width="248" height="58" rx="8"/>
        <rect x="1236" y="446" width="248" height="58" rx="8"/>
        <rect x="1236" y="521" width="248" height="58" rx="8"/>
      </g>
      <g fill="#9ddbc0" text-anchor="middle">
        <text x="1360" y="411">Slot 0</text>
        <text x="1360" y="486">Slot 1</text>
        <text x="1360" y="561">Slot 2</text>
      </g>
    </g>
