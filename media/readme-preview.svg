<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <rect width="1600" height="1080" fill="#121B23"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#F2F1ED">
    <text x="48" y="84" font-size="56" font-weight="bold">Same Pi. Same llama.cpp. Two missing pieces.</text>
    <text x="72" y="155" font-size="36" font-weight="bold">Native reasoning effort</text>
    <text x="842" y="155" font-size="36" font-weight="bold">Session slot pinning</text>
    <rect x="32" y="188" width="1536" height="384" rx="22" fill="#202A34"/>
    <rect x="32" y="600" width="1536" height="384" rx="22" fill="#202A34"/>
    <path d="M800 216 V540 M800 628 V952" stroke="#495761" stroke-width="2"/>
    <g font-size="34" font-weight="bold">
      <text x="72" y="243">Pi alone</text>
      <text x="72" y="655" fill="#92C5E9">Pi + extension</text>
    </g>
    <g font-size="25" fill="#C1C9D0">
      <text x="72" y="281">Native levels not discovered</text>
      <text x="72" y="693">Model-reported levels in Pi’s selector</text>
    </g>

    <!-- The same model exposes the same native levels in both scenarios. -->
    <g fill="#121B23" stroke="#7C8D99" stroke-width="3">
      <rect x="72" y="320" width="320" height="140" rx="14"/>
      <rect x="528" y="304" width="230" height="172" rx="14"/>
      <rect x="72" y="732" width="320" height="140" rx="14"/>
      <rect x="528" y="716" width="230" height="172" rx="14"/>
    </g>
    <g font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="bold">
      <text x="92" y="365">&gt;_ Pi</text>
      <text x="92" y="777">&gt;_ Pi</text>
    </g>
    <g font-family="DejaVu Sans Mono, monospace" font-size="27" text-anchor="middle">
      <text x="232" y="422">off · medium</text>
      <text x="643" y="450">model</text>
      <text x="643" y="862">model</text>
    </g>
    <g fill="#92C5E9">
      <path d="M556 386 L602 370 V407 H556 Z M614 366 L660 350 V407 H614 Z M672 346 L718 330 V407 H672 Z"/>
      <path d="M556 798 L602 782 V819 H556 Z M614 778 L660 762 V819 H614 Z M672 758 L718 742 V819 H672 Z"/>
      <path d="M188 833 L232 817 V849 H188 Z M244 813 L288 797 V849 H244 Z M300 793 L344 777 V849 H300 Z"/>
    </g>
    <path d="M394 390 H525" stroke="#7C8D99" stroke-width="5"/>
    <text x="459" y="373" font-size="34" text-anchor="middle" fill="#C1C9D0">?</text>
    <rect x="374" y="732" width="36" height="140" rx="6" fill="#92C5E9"/>
    <text transform="translate(398 802) rotate(-90)" text-anchor="middle" font-size="21" fill="#121B23" font-weight="bold">extension</text>
    <path d="M414 802 H524 M432 788 L414 802 L432 816" stroke="#92C5E9" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="530" font-size="26" fill="#C1C9D0">Default choices, not the model’s full effort range</text>
    <text x="72" y="942" font-size="26" fill="#92C5E9">Discover and select low · medium · xhigh</text>

    <!-- Illustrative sequence: one slot is reused by alternating sessions. -->
    <text x="840" y="243" font-size="27" font-weight="bold">Without pinning: possible cache displacement</text>
    <text x="840" y="282" font-size="25" fill="#C1C9D0">Same model. Same slot. Three successive turns.</text>
    <g fill="#121B23" stroke="#7C8D99" stroke-width="3">
      <rect x="840" y="308" width="200" height="132" rx="12"/>
      <rect x="1080" y="308" width="200" height="132" rx="12"/>
      <rect x="1320" y="308" width="200" height="132" rx="12"/>
    </g>
    <g font-size="25" font-weight="bold" text-anchor="middle">
      <text x="940" y="344" fill="#92C5E9">1 · A runs</text>
      <text x="1180" y="344" fill="#F1BE58">2 · B runs</text>
      <text x="1420" y="344" fill="#92C5E9">3 · A returns</text>
    </g>
    <g fill="#92C5E9">
      <rect x="854" y="365" width="172" height="54" rx="7"/>
      <rect x="1334" y="365" width="172" height="54" rx="7"/>
    </g>
    <rect x="1094" y="365" width="172" height="54" rx="7" fill="#F1BE58"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="bold" fill="#121B23" text-anchor="middle">
      <text x="940" y="401">Slot 0: A</text>
      <text x="1180" y="401">Slot 0: B</text>
      <text x="1420" y="401">Slot 0: A</text>
    </g>
    <path d="M1048 392 H1070 M1062 384 L1070 392 L1062 400 M1288 392 H1310 M1302 384 L1310 392 L1302 400" fill="none" stroke="#C1C9D0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="25" text-anchor="middle">
      <text x="940" y="478" fill="#C1C9D0">A’s cache stored</text>
      <text x="1180" y="478" fill="#F1BE58">A’s cache displaced</text>
      <text x="1420" y="478" fill="#F1BE58" font-weight="bold">A reprocesses</text>
    </g>
    <text x="840" y="535" font-size="29" font-weight="bold" fill="#F1BE58">Cache invalidation → prompt reprocessing</text>

    <text x="840" y="655" font-size="30" font-weight="bold">Sessions keep separate slots</text>
    <rect x="1220" y="694" width="300" height="212" rx="14" fill="#121B23" stroke="#C1C9D0" stroke-width="3"/>
    <text x="1370" y="728" font-size="24" text-anchor="middle" font-weight="bold">One shared model</text>
    <rect x="1238" y="852" width="264" height="36" rx="7" fill="#202A34" stroke="#7C8D99" stroke-width="2"/>
    <g fill="none" stroke-width="6" stroke-linecap="round">
      <path d="M1056 766 H1256" stroke="#92C5E9"/>
      <path d="M1056 820 H1256" stroke="#F1BE58"/>
    </g>
    <g fill="#92C5E9">
      <rect x="840" y="744" width="216" height="44" rx="7"/>
      <rect x="1238" y="744" width="264" height="44" rx="7"/>
    </g>
    <g fill="#F1BE58">
      <rect x="840" y="798" width="216" height="44" rx="7"/>
      <rect x="1238" y="798" width="264" height="44" rx="7"/>
    </g>
    <g font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="bold" fill="#121B23">
      <text x="856" y="774">&gt;_ Agent A</text>
      <text x="856" y="828">&gt;_ Agent B</text>
      <text x="1290" y="774">Slot 0</text>
      <text x="1290" y="828">Slot 1</text>
    </g>
    <text x="1290" y="879" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#C1C9D0">Unassigned</text>
    <g fill="#121B23"><circle cx="1256" cy="766" r="7"/><circle cx="1256" cy="820" r="7"/></g>
    <circle cx="1256" cy="870" r="7" fill="none" stroke="#7C8D99" stroke-width="2"/>
    <text x="840" y="947" font-size="28" font-weight="bold" fill="#92C5E9">Stable assignments support cache reuse</text>
    <text x="48" y="1035" font-size="25" fill="#C1C9D0">Pi 1.5.2 · Qwen3.8-27B example · Cache retention still depends on server settings and memory.</text>
  </g>
</svg>
