<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <rect width="1600" height="1080" fill="#121B23"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#F2F1ED">
    <text x="72" y="84" font-size="56" font-weight="bold">Same Pi. Same llama.cpp. Two missing pieces.</text>
    <text x="72" y="155" font-size="36" font-weight="bold">Native reasoning effort</text>
    <text x="842" y="155" font-size="36" font-weight="bold">Session slot pinning</text>
    <rect x="32" y="188" width="1536" height="384" rx="22" fill="#202A34"/>
    <rect x="32" y="600" width="1536" height="384" rx="22" fill="#202A34"/>
    <path d="M800 216 V540 M800 628 V952" stroke="#495761" stroke-width="2"/>
    <g font-size="34" font-weight="bold">
      <text x="72" y="243">Pi alone</text>
      <text x="72" y="655" fill="#92C5E9">Pi + extension</text>
    </g>
    <g font-size="25" fill="#C1C9D0">
      <text x="72" y="281">Native levels not discovered</text>
      <text x="72" y="693">Model-reported levels in Pi’s selector</text>
    </g>

    <!-- The same model exposes the same native levels in both scenarios. -->
    <g fill="#121B23" stroke="#7C8D99" stroke-width="3">
      <rect x="72" y="320" width="320" height="140" rx="14"/>
      <rect x="528" y="304" width="230" height="172" rx="14"/>
      <rect x="72" y="732" width="320" height="140" rx="14"/>
      <rect x="528" y="716" width="230" height="172" rx="14"/>
    </g>
    <g font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="bold">
      <text x="92" y="365">&gt;_ Pi</text>
      <text x="92" y="777">&gt;_ Pi</text>
    </g>
    <g font-family="DejaVu Sans Mono, monospace" font-size="27" text-anchor="middle">
      <text x="232" y="422">off · medium</text>
      <text x="643" y="450">model</text>
      <text x="643" y="862">model</text>
    </g>
    <g fill="#92C5E9">
      <path d="M556 386 L602 370 V407 H556 Z M614 366 L660 350 V407 H614 Z M672 346 L718 330 V407 H672 Z"/>
      <path d="M556 798 L602 782 V819 H556 Z M614 778 L660 762 V819 H614 Z M672 758 L718 742 V819 H672 Z"/>
      <path d="M188 833 L232 817 V849 H188 Z M300 793 L344 777 V849 H300 Z"/>
    </g>
    <!-- The chosen level takes Pi's colour, matching the animated preview. -->
    <path fill="#F2F1ED" d="M244 813 L288 797 V849 H244 Z"/>
    <path d="M394 390 H525" stroke="#7C8D99" stroke-width="5"/>
    <text x="459" y="373" font-size="34" text-anchor="middle" fill="#C1C9D0">?</text>
    <rect x="374" y="732" width="36" height="140" rx="6" fill="#92C5E9"/>
    <text transform="translate(398 802) rotate(-90)" text-anchor="middle" font-size="21" fill="#121B23" font-weight="bold">extension</text>
    <path d="M414 802 H524 M432 788 L414 802 L432 816" stroke="#92C5E9" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="530" font-size="26" fill="#C1C9D0">Default choices, not the model’s full effort range</text>
    <text x="72" y="942" font-size="26" fill="#92C5E9">Discover and select low · medium · xhigh</text>

    <!-- Cache blocks represent conversation prefixes, not reserved memory capacity. -->
    <text x="840" y="243" font-size="30" font-weight="bold">Without pinning: cached work can be lost</text>
    <text x="840" y="282" font-size="25" fill="#C1C9D0">Example: B reuses A’s slot while another is unused</text>
    <rect x="1056" y="304" width="464" height="208" rx="14" fill="#121B23" stroke="#C1C9D0" stroke-width="3"/>
    <text x="1288" y="338" font-size="24" text-anchor="middle" font-weight="bold">One shared model</text>
    <rect x="1080" y="346" width="420" height="120" rx="7" fill="none" stroke="#7C8D99" stroke-width="2"/>
    <rect x="840" y="350" width="174" height="46" rx="7" fill="#92C5E9"/>
    <rect x="840" y="420" width="174" height="46" rx="7" fill="#F1BE58"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="bold" fill="#121B23">
      <text x="855" y="381">&gt;_ A first</text>
      <text x="855" y="451">&gt;_ B next</text>
    </g>
    <path d="M1018 373 H1078" stroke="#92C5E9" stroke-width="5" stroke-dasharray="7 7"/>
    <path d="M1018 443 H1078 M1066 431 L1078 443 L1066 455" stroke="#F1BE58" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#92C5E9" opacity="0.65">
      <rect x="1094" y="355" width="40" height="34" rx="4"/>
      <rect x="1142" y="355" width="40" height="34" rx="4"/>
      <rect x="1190" y="355" width="40" height="34" rx="4"/>
      <rect x="1238" y="355" width="40" height="34" rx="4"/>
    </g>
    <path d="M1090 351 L1282 393 M1090 393 L1282 351" stroke="#F2F1ED" stroke-width="5" stroke-linecap="round"/>
    <text x="1300" y="380" font-size="25" fill="#92C5E9">A’s cache lost</text>
    <path d="M1186 399 V417 M1176 407 L1186 417 L1196 407" stroke="#F1BE58" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#F1BE58">
      <rect x="1094" y="426" width="40" height="34" rx="4"/>
      <rect x="1142" y="426" width="40" height="34" rx="4"/>
      <rect x="1190" y="426" width="40" height="34" rx="4"/>
      <rect x="1238" y="426" width="40" height="34" rx="4"/>
    </g>
    <text x="1300" y="451" font-size="25" fill="#F1BE58">B takes slot 0</text>
    <rect x="1080" y="474" width="420" height="28" rx="7" fill="none" stroke="#7C8D99" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1290" y="495" font-size="24" text-anchor="middle" fill="#C1C9D0">Slot 1 · unused</text>
    <text x="840" y="548" font-size="30" font-weight="bold" fill="#F1BE58">A returns → rebuild A’s context</text>

    <text x="840" y="655" font-size="30" font-weight="bold">With pinning: separate cached contexts</text>
    <text x="840" y="694" font-size="25" fill="#C1C9D0">Same two slots. Separate contexts across turns.</text>
    <rect x="1056" y="716" width="464" height="186" rx="14" fill="#121B23" stroke="#C1C9D0" stroke-width="3"/>
    <text x="1288" y="750" font-size="24" text-anchor="middle" font-weight="bold">One shared model</text>
    <rect x="840" y="766" width="174" height="46" rx="7" fill="#92C5E9"/>
    <rect x="840" y="832" width="174" height="46" rx="7" fill="#F1BE58"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="bold" fill="#121B23">
      <text x="855" y="797">&gt;_ Agent A</text>
      <text x="855" y="863">&gt;_ Agent B</text>
    </g>
    <path d="M1018 789 H1090" stroke="#92C5E9" stroke-width="5"/>
    <path d="M1018 855 H1090" stroke="#F1BE58" stroke-width="5"/>
    <rect x="1080" y="764" width="420" height="50" rx="7" fill="#202A34" stroke="#92C5E9" stroke-width="2"/>
    <rect x="1080" y="830" width="420" height="50" rx="7" fill="#202A34" stroke="#F1BE58" stroke-width="2"/>
    <g fill="#92C5E9">
      <rect x="1094" y="772" width="40" height="34" rx="4"/>
      <rect x="1142" y="772" width="40" height="34" rx="4"/>
      <rect x="1190" y="772" width="40" height="34" rx="4"/>
      <rect x="1238" y="772" width="40" height="34" rx="4"/>
    </g>
    <g fill="#F1BE58">
      <rect x="1094" y="838" width="40" height="34" rx="4"/>
      <rect x="1142" y="838" width="40" height="34" rx="4"/>
      <rect x="1190" y="838" width="40" height="34" rx="4"/>
      <rect x="1238" y="838" width="40" height="34" rx="4"/>
    </g>
    <text x="1300" y="797" font-size="25" fill="#92C5E9">Slot 0 · A</text>
    <text x="1300" y="863" font-size="25" fill="#F1BE58">Slot 1 · B</text>
    <text x="840" y="947" font-size="28" font-weight="bold" fill="#92C5E9">A returns → reuse A’s cached context</text>
    <text x="72" y="1035" font-size="25" fill="#C1C9D0">Pi 1.5.2 · Qwen3.8-27B example · Cache retention still depends on server settings and memory.</text>
  </g>
</svg>
