    <rect x="840" y="382" width="220" height="68" rx="10" fill="#92C5E9"/>
    <rect x="840" y="470" width="220" height="68" rx="10" fill="#F1BE58"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="27" font-weight="bold" fill="#121B23">
      <text x="858" y="426">&gt;_ Agent A</text>
      <text x="858" y="514">&gt;_ Agent B</text>
      <text x="1270" y="426">Slot 0</text>
      <text x="1270" y="514">Slot 1</text>
    </g>
    <circle cx="1236" cy="416" r="10" fill="#121B23"/>
    <circle cx="1236" cy="504" r="10" fill="#121B23"/>
    <circle cx="1236" cy="592" r="10" fill="none" stroke="#7C8D99" stroke-width="3"/>
    <text x="1270" y="602" font-family="DejaVu Sans Mono, monospace" font-size="27" fill="#C1C9D0">Unassigned</text>
    <text x="840" y="708" font-size="26" fill="#C1C9D0">Support cache reuse · inspect with /llama-slots</text>
  </g>
