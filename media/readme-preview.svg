    <g font-family="DejaVu Sans Mono, monospace" font-size="32" text-anchor="middle">
      <text x="196" y="626">low</text>
      <rect x="304" y="592" width="192" height="50" rx="10" fill="#92C5E9"/>
      <text x="400" y="626" fill="#121B23" font-weight="bold">medium</text>
      <text x="604" y="626">xhigh</text>
    </g>
    <text x="72" y="708" font-size="26" fill="#C1C9D0">Example levels · availability depends on model</text>

    <rect x="1192" y="312" width="328" height="338" rx="18" fill="#121B23" stroke="#C1C9D0" stroke-width="3"/>
    <text x="1356" y="357" text-anchor="middle" font-size="27" font-weight="bold">One shared model</text>
    <rect x="1212" y="382" width="288" height="68" rx="10" fill="#92C5E9"/>
    <rect x="1212" y="470" width="288" height="68" rx="10" fill="#F1BE58"/>
    <rect x="1212" y="558" width="288" height="68" rx="10" fill="#202A34" stroke="#7C8D99" stroke-width="3"/>
    <g fill="none" stroke-width="8" stroke-linecap="round">
      <path d="M1060 416 H1236" stroke="#92C5E9"/>
      <path d="M1060 504 H1236" stroke="#F1BE58"/>
